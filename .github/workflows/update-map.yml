# Descarga el mapa de Sant Boi de OpenStreetMap y lo publica en data/ para que el juego
# no dependa de los servidores de Overpass (que a menudo están saturados).
name: Actualizar mapa de Sant Boi

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # cada lunes de madrugada
  push:
    paths:
      - 'tools/fetch-osm.mjs'
      - '.github/workflows/update-map.yml'
      - 'js/data.js'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar el mapa desde Overpass
        run: node tools/fetch-osm.mjs
      - name: Guardar el mapa en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar mapa de Sant Boi desde OpenStreetMap"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Pedir a GitHub Pages que publique la versión nueva
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
